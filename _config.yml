timezone: Pacific/Auckland
encoding: utf-8
title: Tastycat
url: https://catsaretasty.github.io

# Staff and RDJ collections are dormant: set output to true to publish their pages again.
collections:
  rdjs:
    output: false
    permalink: /rdj/:path/
  staff:
      output: false
      permalink: /staff/:path/
  rules:
      output: false
  faqs:
        output: false
  events:
        output: true
        permalink: /event/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: rdjs
    values:
      layout: bio-rdj
  - scope:
      path: ""
      type: staff
    values:
      layout: bio-staff
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: events
    values:
      layout: event

exclude:
- CNAME
- Gemfile
- Gemfile.lock
- CONTRIBUTING.md
- LICENSE
- README.md
- scripts

plugins:
  - jekyll-sitemap
